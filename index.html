<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #1e1e1e;
        font-family: Arial, sans-serif;
      }

      .calculator {
        width: 330px;
        padding: 20px;
        background: #2b2b2b;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      }

      #display {
        width: 100%;
        height: 80px;
        margin-bottom: 20px;
        padding: 15px;
        border: none;
        border-radius: 12px;
        background: #111;
        color: white;
        font-size: 32px;
        text-align: right;
        outline: none;
      }

      .buttons {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
      }

      button {
        height: 60px;
        border: none;
        border-radius: 12px;
        font-size: 22px;
        cursor: pointer;
        background: #444;
        color: white;
        transition: 0.15s;
      }

      button:hover {
        background: #555;
      }

      button:active {
        transform: scale(0.95);
      }

      .operator {
        background: #ff9500;
      }

      .operator:hover {
        background: #e68600;
      }

      .clear {
        background: #d9534f;
      }

      .clear:hover {
        background: #c9302c;
      }

      .equal {
        background: #28a745;
      }

      .equal:hover {
        background: #218838;
      }

      .zero {
        grid-column: span 2;
      }
    </style>
  </head>

  <body>
    <div class="calculator">
      <input type="text" id="display" value="0" readonly />

      <div class="buttons">
        <button class="clear" onclick="clearDisplay()">AC</button>
        <button onclick="deleteLast()">DEL</button>
        <button onclick="percentage()">%</button>
        <button class="operator" onclick="chooseOperator('/')">÷</button>

        <button onclick="addNumber('7')">7</button>
        <button onclick="addNumber('8')">8</button>
        <button onclick="addNumber('9')">9</button>
        <button class="operator" onclick="chooseOperator('*')">×</button>

        <button onclick="addNumber('4')">4</button>
        <button onclick="addNumber('5')">5</button>
        <button onclick="addNumber('6')">6</button>
        <button class="operator" onclick="chooseOperator('-')">−</button>

        <button onclick="addNumber('1')">1</button>
        <button onclick="addNumber('2')">2</button>
        <button onclick="addNumber('3')">3</button>
        <button class="operator" onclick="chooseOperator('+')">+</button>

        <button class="zero" onclick="addNumber('0')">0</button>
        <button onclick="addDecimal()">.</button>
        <button class="equal" onclick="calculate()">=</button>
      </div>
    </div>

    <script>
      let display = document.getElementById("display");

      let firstNumber = null;
      let operator = null;
      let waitingForSecondNumber = false;

      // Add number
      function addNumber(number) {
        if (display.value === "Error") {
          display.value = "0";
        }

        if (waitingForSecondNumber) {
          display.value = number;
          waitingForSecondNumber = false;
        } else {
          if (display.value === "0") {
            display.value = number;
          } else {
            display.value += number;
          }
        }
      }

      // Add decimal
      function addDecimal() {
        if (waitingForSecondNumber) {
          display.value = "0.";
          waitingForSecondNumber = false;
          return;
        }

        if (!display.value.includes(".")) {
          display.value += ".";
        }
      }

      // Choose operator
      function chooseOperator(selectedOperator) {
        const currentNumber = parseFloat(display.value);

        if (isNaN(currentNumber)) {
          return;
        }

        if (operator !== null && !waitingForSecondNumber) {
          calculate();
        }

        firstNumber = parseFloat(display.value);
        operator = selectedOperator;
        waitingForSecondNumber = true;
      }

      // Calculate result
      function calculate() {
        if (operator === null || firstNumber === null) {
          return;
        }

        const secondNumber = parseFloat(display.value);

        if (isNaN(secondNumber)) {
          return;
        }

        let result;

        switch (operator) {
          case "+":
            result = firstNumber + secondNumber;
            break;

          case "-":
            result = firstNumber - secondNumber;
            break;

          case "*":
            result = firstNumber * secondNumber;
            break;

          case "/":
            if (secondNumber === 0) {
              display.value = "Error";
              firstNumber = null;
              operator = null;
              return;
            }

            result = firstNumber / secondNumber;
            break;
        }

        display.value = formatResult(result);

        firstNumber = result;
        operator = null;
        waitingForSecondNumber = true;
      }

      // Percentage
      function percentage() {
        let number = parseFloat(display.value);

        if (!isNaN(number)) {
          display.value = formatResult(number / 100);
        }
      }

      // Delete last number
      function deleteLast() {
        if (display.value === "Error") {
          clearDisplay();
          return;
        }

        if (display.value.length === 1) {
          display.value = "0";
        } else {
          display.value = display.value.slice(0, -1);
        }
      }

      // Clear calculator
      function clearDisplay() {
        display.value = "0";
        firstNumber = null;
        operator = null;
        waitingForSecondNumber = false;
      }

      // Format result
      function formatResult(number) {
        if (!Number.isFinite(number)) {
          return "Error";
        }

        return parseFloat(number.toFixed(10)).toString();
      }

      // Keyboard support
      document.addEventListener("keydown", function (event) {
        const key = event.key;

        if (key >= "0" && key <= "9") {
          addNumber(key);
        } else if (key === ".") {
          addDecimal();
        } else if (key === "+") {
          chooseOperator("+");
        } else if (key === "-") {
          chooseOperator("-");
        } else if (key === "*") {
          chooseOperator("*");
        } else if (key === "/") {
          event.preventDefault();
          chooseOperator("/");
        } else if (key === "Enter" || key === "=") {
          calculate();
        } else if (key === "Backspace") {
          deleteLast();
        } else if (key === "Escape") {
          clearDisplay();
        } else if (key === "%") {
          percentage();
        }
      });
    </script>
  </body>
</html>
